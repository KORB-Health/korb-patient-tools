<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KORB — GLP-1 Pharmacy Routing by State</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#21275B;--teal:#00B2C3;--cream:#ECE9D1;--gold:#FBB040;
      --muted:#5A6070;--line:#DCD9C4;--err:#B3261E;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
     background:var(--cream);color:var(--navy);-webkit-font-smoothing:antialiased;font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:14px 16px 16px}

/* header row: title left, picker right, stacks under 700px */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
     flex-wrap:wrap;margin-bottom:14px}
.ttl{flex:1 1 260px;min-width:0}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
         color:var(--muted);margin:0 0 3px}
h2{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.25}
.rule{height:3px;width:48px;background:var(--teal);border-radius:2px;margin:7px 0 0}
.pick{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;min-width:250px}
.pick label{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.pick select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
             font-family:inherit;font-size:15px;color:var(--navy);background:#fff}
.pick select:focus{outline:3px solid var(--teal);outline-offset:2px;border-color:var(--teal)}
@media(max-width:700px){.pick{flex:1 1 100%;min-width:0}}

/* idle line shown before a state is picked */
.idle{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 16px;
      font-size:13px;line-height:1.6;color:var(--muted)}
.idle b{color:var(--navy);font-weight:700}

/* result */
.result{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
        box-shadow:0 1px 3px rgba(33,39,91,.07)}
.result .hd{background:var(--navy);color:#fff;padding:8px 16px;font-size:12px;font-weight:800;
            letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:8px;
            -webkit-print-color-adjust:exact;print-color-adjust:exact}
.result .bd{padding:14px 16px 16px}
.headline{font-size:22px;font-weight:800;line-height:1.15;margin:0 0 3px}
.why{font-size:12.5px;color:var(--muted);margin:0 0 13px;line-height:1.5}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
      border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cols.two{grid-template-columns:repeat(2,1fr)}
.col{background:#fff;padding:10px 12px}
.col .k{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
        color:var(--muted);margin-bottom:6px}
.col .v{font-size:13px;line-height:1.5;font-weight:600;color:var(--navy)}
.col .v em{font-weight:500;color:var(--muted);font-style:normal;font-size:12.5px}
.col.blocked .v{color:var(--err)}
.note{font-size:11px;color:var(--muted);font-weight:500;margin-top:4px;line-height:1.45}
/* stay 2-up on a phone rather than stacking to three full-width rows */
@media(max-width:620px){.cols,.cols.two{grid-template-columns:repeat(2,1fr)}}
@media(max-width:340px){.cols,.cols.two{grid-template-columns:1fr}}
.callout{border-radius:7px;padding:9px 12px;font-size:12.5px;line-height:1.55;margin-top:11px;
         background:#FFF6E6;border-left:4px solid var(--gold);color:#5D4200}

.foot{margin-top:9px;font-size:10.5px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="ttl">
      <p class="eyebrow">GLP-1 / Weight Loss</p>
      <h2>Pharmacy Routing by State</h2>
      <div class="rule"></div>
    </div>
    <div class="pick">
      <label for="st">Patient state</label>
      <select id="st"><option value="">— select a state —</option></select>
    </div>
  </div>

  <div id="err"></div>
  <div id="out"></div>

  <p class="foot" id="foot"></p>

</div>

<!-- korb-pharmacies.js MUST load first: korb-glp1-data.js takes its
     pharmacy footprints from it at load, and throws on routing without it. -->
<script src="korb-pharmacies.js"></script>
<script src="korb-glp1-data.js"></script>
<script>
(function(){
  "use strict";
  var D = (typeof KORB_GLP1 !== 'undefined') ? KORB_GLP1 : null;

  if(!D || !D.pharmacies || typeof D.pharmacyOptionsForState !== 'function'){
    document.getElementById('err').innerHTML =
      '<div class="callout"><strong>Routing data did not load.</strong> '
      + 'This page needs korb-glp1-data.js in the same folder. Do not use it until that is fixed '
      + '— an empty page is not the same as "no restriction".</div>';
    return;
  }

  /* Compounding GLP-1 pharmacies only, selected positively rather than by exclusion, so
     a channel added later cannot leak in. Brand routes (LillyDirect, NovoCare, retail) are
     manufacturer-direct or retail and are not state-routed. A pharmacy retired from GLP-1
     drops out on its own, which is how Greenwich disappeared on 2026-09-11. */
  var KEYS = Object.keys(D.pharmacies).filter(function(k){
    var p = D.pharmacies[k];
    return p.type === 'compounding' && p.status !== 'glp1-retired';
  });

  var NAME={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',
    CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',
    GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',
    KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',
    MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',
    NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',
    ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',
    RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',
    UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',
    WI:'Wisconsin',WY:'Wyoming'};

  var STATES = (D.states.korbActive || []).slice().sort();

  /* Order for the "Also allowed" column, most preferred first. This is a KORB operational
     preference, not something the data file encodes: Belmar sits last everywhere because of
     cost, and is only the default in California where it is the sole licensed route. An
     exception-status pharmacy always sinks below a clean backup regardless of this list.
     If a compounding pharmacy is ever added without being placed here, the self-check fails
     rather than letting it sort into an arbitrary position. */
  var PREFER = ['premier', 'farmakeio', 'belmar'];
  function prefRank(k){
    var i = PREFER.indexOf(k);
    return i === -1 ? PREFER.length : i;
  }
  /* One comparator, used by both the renderer and the self-check. Do not inline a copy of
     this anywhere — a duplicated comparator makes the assertion vacuous, which is exactly
     what a negative test caught on 2026-09-13. */
  function altOrder(a, b){
    var ea = (a.status === 'warning') ? 1 : 0, eb = (b.status === 'warning') ? 1 : 0;
    return (ea - eb) || (prefRank(a.key) - prefRank(b.key));
  }
  function altsFor(st, def){
    return optsFor(st)
      .filter(function(o){ return o.selectable !== false && (!def || o.key !== def.key); })
      .sort(altOrder);
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function optsFor(st){
    return D.pharmacyOptionsForState(st).filter(function(o){ return KEYS.indexOf(o.key) !== -1; });
  }
  function defaultFor(st){
    return optsFor(st).filter(function(o){ return o.status === 'ok'; })[0] || null;
  }

  /* ---- group states by default pharmacy: drives both the idle line and the table ---- */
  var group = {};
  STATES.forEach(function(st){
    var d = defaultFor(st);
    var k = d ? d.key : 'none';
    (group[k] = group[k] || []).push(st);
  });
  var order = Object.keys(group).sort(function(a,b){ return group[b].length - group[a].length; });

  /* ---- picker ---- */
  var sel = document.getElementById('st');
  STATES.forEach(function(c){
    var o = document.createElement('option');
    o.value = c; o.textContent = c + ' — ' + (NAME[c] || c);
    sel.appendChild(o);
  });

  /* Idle line: the whole 51-state picture in one sentence, generated from the data.
     Replaces the old always-visible table without losing the at-a-glance answer. */
  function idleHTML(){
    var parts = order.map(function(k){
      var nm = D.pharmacies[k] ? D.pharmacies[k].name : 'Not configured';
      var n  = group[k].length;
      return '<b>' + esc(nm) + '</b> ' + (n === 1 ? '(' + group[k][0] + ')' : n);
    });
    return '<div class="idle">Pick a state above for the full routing, including which '
         + 'pharmacies are blocked there. Current split: ' + parts.join(' &middot; ')
         + '.</div>';
  }

  function render(){
    var st = sel.value, host = document.getElementById('out');
    if(!st){ host.innerHTML = idleHTML(); return; }

    var opts = optsFor(st);
    var def  = defaultFor(st);
    var alt  = altsFor(st, def);   /* clean backups first, exceptions last, then PREFER */
    var no   = opts.filter(function(o){ return o.selectable === false; });
    var route = (typeof D.states.routeTo === 'function') ? D.states.routeTo(st) : null;

    var h = '<div class="result"><div class="hd"><span>' + esc(NAME[st] || st)
          + '</span><span>' + esc(st) + '</span></div><div class="bd">';

    if(def){
      /* Just the basis. "Send here unless there is a reason not to" was on every state and
         the Send to column already says it. */
      var basis = (route && route.basis) ? String(route.basis).trim() : '';
      if(basis) basis = basis.charAt(0).toUpperCase() + basis.slice(1);
      h += '<p class="headline">' + esc(def.name) + '</p>'
         + '<p class="why">' + (basis ? esc(basis).replace(/\.?$/, '.') : 'Default route for this state.') + '</p>';
    } else {
      h += '<p class="headline" style="color:var(--err)">No default pharmacy</p>'
         + '<p class="why">Nothing is configured as the default for this state. Ask before prescribing.</p>';
    }

    h += '<div class="cols' + (no.length ? '' : ' two') + '">';

    h += '<div class="col"><div class="k">Send to</div><div class="v">'
       + (def ? esc(def.name) : '<em>&mdash;</em>') + '</div></div>';

    /* Listed in order of preference, so the tag says which rung each one is on. */
    h += '<div class="col"><div class="k">Also allowed &mdash; in order</div><div class="v">'
       + (alt.length
           ? alt.map(function(o, i){
               var tag = (o.status === 'warning') ? 'exception' : (i === 0 ? 'backup' : 'then');
               return esc(o.name)
                    + ' <span class="note" style="display:inline">(' + tag + ')</span>';
             }).join('<br>')
           : '<em>None. Single source.</em>')
       + '</div></div>';

    if(no.length){
      h += '<div class="col blocked"><div class="k">Cannot ship</div><div class="v">'
         + no.map(function(o){ return esc(o.name); }).join('<br>')
         + '</div><div class="note">Licensing limit. Not overridable.</div></div>';
    }
    h += '</div>';

    if(!alt.length){
      h += '<div class="callout"><strong>Single source.</strong> '
         + esc(def ? def.name : 'One pharmacy') + ' is the only option for this state. '
         + 'If they cannot fill, there is no second route — escalate rather than substituting.</div>';
    }

    /* The data file's warning text runs several sentences. The column already flags the
       pharmacy as an exception, so only the first sentence earns space here. */
    var warned = opts.filter(function(o){ return o.status === 'warning' && o.selectable !== false; });
    warned.forEach(function(o){
      var m = String(o.message || '').trim();
      var first = m.split(/(?<=\.)\s+/)[0] || m;
      h += '<div class="callout"><strong>' + esc(o.name) + '</strong> ' + esc(first);
      /* Verbatim from the data file's pharmacySelection.overrideReasons so this stays in
         step with it. Answers "when is the exception actually justified" at the point of
         decision, which is the only place it matters. */
      var rs = (D.pharmacySelection && D.pharmacySelection.overrideReasons) || [];
      if(rs.length){
        h += '<br><span class="note" style="display:inline;color:inherit;opacity:.85">'
           + 'Override is reasonable when: ' + rs.map(esc).join(' &middot; ') + '.</span>';
      }
      h += '</div>';
    });

    h += '</div></div>';
    host.innerHTML = h;
  }
  sel.addEventListener('change', render);
  render();

  document.getElementById('foot').textContent =
    'Compounded GLP-1 only. Brand through LillyDirect and NovoCare is not state-routed. '
    + 'Live from korb-glp1-data.js v' + (D.meta && D.meta.version || '?')
    + ' (' + (D.meta && D.meta.lastUpdated || '?') + '), ' + STATES.length + ' states and DC.';

  /* ---- self check ---- */
  window.KORB_ROUTING_SELFCHECK = function(){
    var problems = [];
    if(STATES.length !== 51) problems.push('state list is ' + STATES.length + ', expected 51');
    STATES.forEach(function(st){
      if(!NAME[st]) problems.push(st + ': no display name');
      var o = optsFor(st);
      var d = o.filter(function(x){ return x.status === 'ok'; });
      if(d.length !== 1) problems.push(st + ': ' + d.length + ' defaults, expected 1');
      if(!o.filter(function(x){ return x.selectable !== false; }).length)
        problems.push(st + ': no selectable pharmacy');
      o.forEach(function(x){
        var p = D.pharmacies[x.key];
        var excluded = (p.hardExcludes || []).indexOf(st) !== -1;
        if(excluded && x.selectable !== false) problems.push(st + ': ' + x.key + ' excluded but offered');
        if(x.status === 'ok' && (p.shipsTo || []).indexOf(st) === -1)
          problems.push(st + ': ' + x.key + ' is default but does not ship here');
      });
    });
    KEYS.forEach(function(k){
      var p = D.pharmacies[k];
      if(p.type !== 'compounding') problems.push(k + ': not a compounding pharmacy but in scope');
      if(p.status === 'glp1-retired') problems.push(k + ': retired from GLP-1 but in scope');
      if(PREFER.indexOf(k) === -1)
        problems.push(k + ': in scope but missing from PREFER, so it sorts last by accident');
    });
    /* Belmar must never outrank a clean backup outside California. Assert the rendered
       order rather than trusting the sort, so a future data change cannot quietly undo it. */
    STATES.forEach(function(st){
      if(st === 'CA') return;
      var a = altsFor(st, defaultFor(st)).map(function(o){ return o.key; });
      var bi = a.indexOf('belmar');
      if(bi !== -1 && bi !== a.length - 1)
        problems.push(st + ': belmar is listed at position ' + (bi + 1) + ' of ' + a.length + ', expected last');
      if(a.indexOf('farmakeio') > bi && bi !== -1)
        problems.push(st + ': farmakeio is listed below belmar');
    });
    /* the idle line must account for every state, or it is quietly lying about coverage */
    var counted = order.reduce(function(a,k){ return a + group[k].length; }, 0);
    if(counted !== STATES.length)
      problems.push('idle summary covers ' + counted + ' states, expected ' + STATES.length);
    return { states: STATES.length, pharmacies: KEYS, problems: problems };
  };
})();
</script>
</body>
</html>
